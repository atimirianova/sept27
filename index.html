<style>
:root{
  --bg:#F5EDE1; --card:#FFFBF5; --ink:#2C221C; --ink-2:#6B5A4E; --line:#E3D6C6;
  --accent:#B8756D; --accent-soft:#F3DCD8; --sage:#6F7D55; --sage-soft:#E4E9D6;
  --cocoa:#6F4E37; --butter:#F2DFA6; --shadow:0 10px 30px rgba(60,40,25,.10);
  --display:"Unbounded",system-ui,sans-serif; --body:"Golos Text",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#241B16; --card:#2E2420; --ink:#F3E9DC; --ink-2:#B9A797; --line:#46382F;
  --accent:#E0A69E; --accent-soft:#4A3330; --sage:#A7B58C; --sage-soft:#33392A;
  --cocoa:#D9B79C; --butter:#D9C48A; --shadow:0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#241B16; --card:#2E2420; --ink:#F3E9DC; --ink-2:#B9A797; --line:#46382F;
  --accent:#E0A69E; --accent-soft:#4A3330; --sage:#A7B58C; --sage-soft:#33392A;
  --cocoa:#D9B79C; --butter:#D9C48A; --shadow:0 10px 30px rgba(0,0,0,.35);
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-inline:16px;padding-block:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.app{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-block:24px;gap:20px}
.wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:20px}
.wrap.host{max-width:920px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,54px);line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:clamp(20px,3.6vw,32px);line-height:1.15;margin:0;text-wrap:balance}
.host h2{font-size:clamp(26px,4.2vw,44px)}
p{margin:0}
.muted{color:var(--ink-2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
.host .card{padding:clamp(24px,4vw,48px)}
.story{font-size:clamp(17px,2.1vw,24px);line-height:1.55;max-width:62ch}
.host .story{font-size:clamp(20px,2.6vw,30px)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.dots i.done{background:var(--sage)}
.dots i.now{background:var(--accent);transform:scale(1.25)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;
  padding:16px 18px;border-radius:14px;border:2px solid var(--line);background:var(--card);
  font-size:18px;font-weight:500;transition:transform .08s ease,border-color .12s ease}
.opt:active{transform:scale(.99)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--sage);background:var(--sage-soft)}
.opt.wrong{opacity:.55}
.opt .tick{font-family:var(--display);font-size:14px;color:var(--ink-2)}
.opt:disabled{cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:16px 26px;border-radius:999px;
  background:var(--cocoa);color:var(--bg);font-weight:600;font-size:18px;min-height:56px}
.btn.ghost{background:transparent;color:var(--ink-2);border:1.5px solid var(--line);min-height:48px;padding:12px 20px;font-size:16px}
.btn.accent{background:var(--accent);color:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.reveal{display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px dashed var(--line)}
.date{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,56px);color:var(--sage);line-height:1.1}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--butter);color:var(--cocoa);
  font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
input[type=text],input[type=number]{width:100%;padding:16px 18px;border-radius:14px;border:2px solid var(--line);background:var(--card);
  color:var(--ink);font-size:18px}
.qr{display:flex;flex-direction:column;align-items:center;gap:12px}
.qr .box{background:#fff;padding:14px;border-radius:16px;display:inline-block}
.qr .url{font-family:var(--body);font-size:13px;color:var(--ink-2);word-break:break-all;text-align:center;max-width:36ch}
.score{font-family:var(--display);font-weight:800;font-size:clamp(56px,16vw,110px);line-height:1;color:var(--accent)}
.score small{font-size:.32em;color:var(--ink-2);font-weight:600}
.tl{display:grid;gap:0;border-left:2px solid var(--line);margin-left:8px;padding-left:22px}
.tl li{list-style:none;position:relative;padding-block:12px;display:grid;gap:2px}
.tl li::before{content:"";position:absolute;left:-30px;top:20px;width:14px;height:14px;border-radius:50%;background:var(--sage);border:3px solid var(--bg)}
.tl li.miss::before{background:var(--accent)}
.tl .d{font-family:var(--display);font-weight:600;font-size:15px;color:var(--sage)}
.tl li.miss .d{color:var(--accent)}
.tl .t{font-weight:600}
.tl .y{font-size:14px;color:var(--ink-2)}
.host .tl{grid-template-columns:1fr 1fr;column-gap:40px}
@media (max-width:640px){.host .tl{grid-template-columns:1fr}}
.choose{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.choose{grid-template-columns:1fr}}
.choose button{padding:26px 18px;border-radius:18px;border:2px solid var(--line);background:var(--card);display:grid;gap:6px;text-align:left}
.choose button b{font-family:var(--display);font-weight:600;font-size:18px}
.choose button span{color:var(--ink-2);font-size:15px}
.tiny{font-size:14px;color:var(--ink-2)}
.bars{display:flex;gap:6px;align-items:flex-end;height:90px}
.bars div{flex:1;display:grid;grid-template-rows:1fr auto;gap:4px;text-align:center;font-size:12px;color:var(--ink-2)}
.bars i{display:block;align-self:end;background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.bars b{font-family:var(--display);font-weight:600;color:var(--ink)}
.top{color:var(--accent)}
.play .choose{grid-template-columns:1fr}
.faces{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.face{display:grid;justify-items:center;gap:10px;padding:10px;border-radius:18px;border:2px solid transparent}
.face:disabled{cursor:default}
.face.picked{border-color:var(--accent);background:var(--accent-soft)}
.face .ph{width:min(38vw,150px);aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--sage-soft);display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:44px;color:var(--sage);border:3px solid var(--line)}
.face .ph img{width:100%;height:100%;object-fit:cover;display:block}
.face b{font-size:17px}
.face .arrow{font-size:13px;color:var(--ink-2)}
.host .faces{max-width:640px;gap:32px}
.host .face .ph{width:min(22vw,240px);font-size:72px}
.host .face b{font-size:22px}
.face.right{border-color:var(--sage);background:var(--sage-soft)}
.face.wrong{opacity:.4}
.ctx{display:block;max-width:min(100%,560px);max-height:60vh;border-radius:14px;border:1px solid var(--line)}
.card.swipe{user-select:none;-webkit-user-select:none;touch-action:pan-y}
.qr.mini .box{padding:6px;border-radius:10px}
.qr.mini{gap:4px}
.qr.mini .url{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

// ---------- состояние ----------
const store = {
  get(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} },
};
let mode = null;
const VER = (s => { let h=0; for (const c of s) h=(h*31 + c.charCodeAt(0))|0; return (h>>>0).toString(36) })(JSON.stringify(GAMES.map(g=>[g.id,g.events.map(e=>[e.title,e.options,e.answer])])));
const KEY = m => "wq3-"+m+"-"+VER;
const fresh = () => ({ g:null, i:-1, phase:"ask", revealed:false, name:"", answers:{}, shown:{}, results:{} });
let S = fresh();
const G  = () => GAMES[S.g];
const EV = () => G().events;
const N  = () => EV().length;
const ans = () => { const id=G().id; if(!Array.isArray(S.answers[id])||S.answers[id].length!==N()) S.answers[id]=Array(N()).fill(null); return S.answers[id] };
const shown = () => { const id=G().id; if(!Array.isArray(S.shown[id])) S.shown[id]=[]; return S.shown[id] };
const results = () => { const id=G().id; if(!Array.isArray(S.results[id])) S.results[id]=[]; return S.results[id] };

function load(){
  const h = location.hash.replace("#","");
  mode = (h==="host"||h==="play") ? h : null;
  const saved = mode ? store.get(KEY(mode)) : null;
  S = Object.assign(fresh(), (saved && typeof saved==="object") ? saved : {});
  if (S.g!=null && !GAMES[S.g]) S.g=null;
}
function save(){ if(mode) store.set(KEY(mode), S) }
function toGames(){ S.g=null; S.i=-1; S.phase="ask"; S.revealed=false; save(); render() }
function startGame(g){ S.g=g; S.i=0; S.phase="ask"; S.revealed=false; ans(); save(); render() }
function resetGame(){ const id=G().id; S.answers[id]=Array(N()).fill(null); S.shown[id]=[]; S.results[id]=[]; S.i=0; S.phase="ask"; S.revealed=false; save(); render() }

// ---------- рендер ----------
const app = document.getElementById("app");
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dots = i => `<div class="dots" aria-hidden="true">${EV().map((_,k)=>`<i class="${k<i?'done':k===i?'now':''}"></i>`).join("")}</div>`;
const scoreOf = () => ans().reduce((n,a,k)=> n + (a===EV()[k].answer?1:0), 0);
const playUrl = () => (PUBLIC_URL || (location.origin + location.pathname)) + "#play";
const gameCards = (intro=true) => `<div class="choose">${GAMES.map((g,k)=>`<button data-g="${k}"><b>${esc(g.tag)} · ${esc(g.name)}</b>${intro?`<span>${esc(g.intro)}</span>`:""}</button>`).join("")}</div>`;

function render(){
  if (!mode) return renderChooser();
  if (mode==="host") return renderHost();
  return renderPlay();
}

function renderChooser(){
  app.innerHTML = `
  <div class="wrap">
    <div><div class="eyebrow">27 сентября 2026</div><h1>Настя и Витя</h1></div>
    <p class="muted">2 игры про их историю. Лика спрашивает — вы отвечаете.</p>
    <div class="choose">
      <button id="go-host"><b>Я на большом экране</b><span>Ноутбук, подключённый к телевизору. Ведёт Лика.</span></button>
      <button id="go-play"><b>Я гость</b><span>Телефон. Отвечаю здесь, счёт вижу в конце.</span></button>
    </div>
  </div>`;
  app.querySelector("#go-host").onclick = () => { location.hash="host"; boot() };
  app.querySelector("#go-play").onclick = () => { location.hash="play"; boot() };
}

function renderHost(){
  if (S.g==null) {
    app.innerHTML = `
    <div class="wrap host">
      <div class="card" style="display:grid;gap:28px;grid-template-columns:1.2fr .8fr;align-items:center">
        <div style="display:grid;gap:14px">
          <div class="eyebrow">27 сентября 2026</div>
          <h1>Настя и Витя</h1>
          <p class="story muted">Гости: наведите камеру на код и нажмите «Я гость». Потом Лика объявит, какую игру открывать.</p>
          ${gameCards()}
        </div>
        <div class="qr"><div class="box" id="qr"></div><div class="url" id="qr-url"></div></div>
      </div>
    </div>`;
    app.querySelectorAll(".choose button").forEach(b => b.onclick = () => startGame(+b.dataset.g));
    drawQR();
    if (matchMedia("(max-width:700px)").matches) app.querySelector(".card").style.gridTemplateColumns="1fr";
    return;
  }
  const i = S.i, n = N();
  if (i >= n) return renderHostEnd();
  const e = EV()[i], forced = S.phase==="reveal", rev = forced || S.revealed;
  app.innerHTML = `
  <div class="wrap host">
    <div class="card" style="display:grid;gap:22px">
      <div class="row"><div class="eyebrow">${esc(G().name)} · ${forced?'ответы · ':''}${i+1} из ${n}</div><div class="row">${dots(i)}<div class="qr mini"><div class="box" id="qr"></div></div></div></div>
      <h2>${esc(e.title)}</h2>
      ${e.story?`<p class="story">${esc(e.story)}</p>`:""}
      ${e.options.length===2?`<div class="faces">
        ${e.options.map((o,k)=>`<button class="face ${rev?(k===e.answer?'right':'wrong'):''}" disabled><span class="ph">${FACES[o]?`<img src="${esc(FACES[o])}" alt="" onerror="this.remove()">`:""}${esc(o[0])}</span><b>${esc(o)}</b></button>`).join("")}
      </div>`:`<div class="opts" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
        ${e.options.map((o,k)=>`<button class="opt ${rev?(k===e.answer?'right':'wrong'):''}" disabled><span>${esc(o)}</span>${rev&&k===e.answer?'<span class="tick">✓</span>':''}</button>`).join("")}
      </div>`}
      ${rev?`<div class="reveal"><span class="eyebrow">Правильный ответ</span><div class="date">${esc(e.options[e.answer])}</div>${e.date&&e.date!==e.options[e.answer]?`<div class="eyebrow">${esc(e.date)}</div>`:""}${e.after?`<p class="story muted">${esc(e.after)}</p>`:""}${e.img?`<img class="ctx" src="${esc(e.img)}" alt="" onerror="this.remove()">`:""}</div>`:""}
      <div class="row">
        <div class="row"><button class="btn ghost" id="games">К играм</button><button class="btn ghost" id="back" ${i===0?'disabled':''}>Назад</button></div>
        <div class="row">
          ${!rev?`<button class="btn accent" id="reveal">Показать ответ</button>`:""}
          <button class="btn ${rev?'':'ghost'}" id="next">${i===n-1?(forced?'К результатам':'Итог'):(rev?'Дальше':'Дальше без ответа')}</button>
        </div>
      </div>
    </div>
  </div>`;
  const q = s => app.querySelector(s);
  drawQR(72);
  q("#games").onclick = toGames;
  q("#back").onclick = () => { S.i=Math.max(0,i-1); S.revealed=shown().includes(i-1); save(); render() };
  if (!rev) q("#reveal").onclick = () => { S.revealed=true; if(!shown().includes(i)) shown().push(i); save(); render() };
  q("#next").onclick = () => { S.i=i+1; S.revealed=shown().includes(i+1); save(); render() };
}

function renderHostEnd(){
  const n = N(), notShown = EV().map((_,k)=>k).filter(k=>!shown().includes(k));
  const R = results().slice().sort((a,b)=>b.score-a.score);
  const counts = Array(n+1).fill(0); R.forEach(r=>counts[Math.max(0,Math.min(n,r.score))]++);
  const mx = Math.max(1,...counts);
  app.innerHTML = `
  <div class="wrap host">
    <div class="card" style="display:grid;gap:24px">
      <div><div class="eyebrow">${esc(G().tag)} · ${esc(G().name)}</div><h2>${notShown.length?'Все ответили. Теперь — как было на самом деле':'Как было на самом деле'}</h2></div>
      ${notShown.length?`<div class="row"><p class="story">${notShown.length===n?'Ответы ещё не показывали.':'Часть ответов ещё не показана.'} Пройти по всем вопросам с ответами и комментариями?</p><button class="btn accent" id="pass">Пройти по ответам</button></div>`:""}
      <ul class="tl">${EV().map(e=>`<li><span class="d">${esc(e.date||e.options[e.answer])}</span><span class="t">${esc(e.title)}${e.date?` — ${esc(e.options[e.answer])}`:""}</span>${e.after?`<span class="y">${esc(e.after)}</span>`:""}</li>`).join("")}</ul>
    </div>
    <div class="card" style="display:grid;gap:14px">
      <div class="eyebrow">Результаты гостей</div>
      <p class="tiny">Лика спрашивает у каждого цифру с телефона и вносит сюда.</p>
      <form id="resf" class="row" style="justify-content:flex-start">
        <input type="text" id="rn" placeholder="Имя" style="flex:1;min-width:140px" autocomplete="off">
        <input type="number" id="rs" min="0" max="${n}" placeholder="из ${n}" style="width:110px">
        <button class="btn ghost" type="submit">Добавить</button>
      </form>
      ${R.length?`
      <ul class="tl">${R.map((r,k)=>`<li><span class="d ${k===0?'top':''}">${r.score} из ${n}</span><span class="t">${esc(r.name)}${k===0?' — победитель':''}</span></li>`).join("")}</ul>
      <div class="bars">${counts.map((c,s)=>`<div><i style="height:${Math.round(c/mx*100)}%"></i><b>${s}</b>${c?`<span>${c}</span>`:'<span>&nbsp;</span>'}</div>`).join("")}</div>
      <p class="tiny">Сколько человек набрали сколько правильных.</p>`:""}
    </div>
    <div class="row"><button class="btn ghost" id="again">Сначала</button><button class="btn" id="games">К играм</button></div>
  </div>`;
  const q = s => app.querySelector(s);
  if (notShown.length) q("#pass").onclick = () => { S.phase="reveal"; S.i=0; S.revealed=true; EV().forEach((_,k)=>{ if(!shown().includes(k)) shown().push(k) }); save(); render() };
  q("#resf").onsubmit = ev => { ev.preventDefault(); const nm=q("#rn").value.trim(), sc=parseInt(q("#rs").value,10); if(!nm||isNaN(sc)) return; results().push({name:nm, score:sc}); save(); render(); setTimeout(()=>app.querySelector("#rn")?.focus(),0) };
  q("#again").onclick = () => { if(confirm("Начать эту игру заново? Результаты тоже сотрутся.")) resetGame() };
  q("#games").onclick = toGames;
}

function drawQR(size=220){
  const box = document.getElementById("qr"), u = playUrl(), url = document.getElementById("qr-url");
  if (!box) return;
  if (url) url.textContent = u;
  if (typeof QRCode === "undefined") { if (url) box.textContent = "Ссылка выше — покажите её гостям"; return; }
  try { new QRCode(box, { text:u, width:size, height:size, colorDark:"#2C221C", colorLight:"#ffffff", correctLevel: QRCode.CorrectLevel.M }) }
  catch(e){ if (url) box.textContent = "Ссылка выше — покажите её гостям" }
}

function renderPlay(){
  if (!S.name) {
    app.innerHTML = `
    <div class="wrap play">
      <div><div class="eyebrow">27 сентября 2026</div><h1>Настя и Витя</h1></div>
      <p class="muted">Правильные ответы покажут на экране, когда все ответят.</p>
      <div class="card" style="display:grid;gap:14px">
        <label for="name" class="eyebrow">Как вас зовут</label>
        <input type="text" id="name" placeholder="Имя" autocomplete="given-name" maxlength="30">
        <button class="btn" id="go">Дальше</button>
      </div>
    </div>`;
    const inp = app.querySelector("#name");
    const go = () => { const v=inp.value.trim(); if(!v){inp.focus();return} S.name=v; save(); render() };
    app.querySelector("#go").onclick = go; inp.onkeydown = ev => { if(ev.key==="Enter") go() };
    inp.focus();
    return;
  }
  if (S.g==null) {
    app.innerHTML = `
    <div class="wrap play">
      <h2>Какую игру объявила Лика?</h2>
      ${gameCards(false)}
    </div>`;
    app.querySelectorAll(".choose button").forEach(b => b.onclick = () => startGame(+b.dataset.g));
    return;
  }
  const i = Math.max(0, S.i), n = N(), A = ans();
  if (i >= n) {
    const sc = scoreOf();
    app.innerHTML = `
    <div class="wrap play">
      <div class="card" style="display:grid;gap:18px;text-align:center">
        <div class="eyebrow">${esc(S.name)} · ${esc(G().name)}</div>
        <div class="score">${sc}<small> из ${n}</small></div>
        <p class="muted">Скажите эту цифру Лике.</p>
      </div>
      <div class="card" style="display:grid;gap:8px">
        <div class="eyebrow">Ваши ответы — правильные покажет Лика</div>
        <ul class="tl">${EV().map((e,k)=>{const ok=A[k]===e.answer;return `<li class="${ok?'':'miss'}"><span class="d">${ok?'верно':'мимо'}</span><span class="t">${esc(e.title)}</span><span class="y">Вы выбрали: ${A[k]==null?'—':esc(e.options[A[k]])}</span></li>`}).join("")}</ul>
      </div>
      <div class="row"><button class="btn ghost" id="again">Эту заново</button><button class="btn" id="games">К играм</button></div>
    </div>`;
    app.querySelector("#again").onclick = () => { if(confirm("Стереть ответы и пройти эту игру заново?")) resetGame() };
    app.querySelector("#games").onclick = toGames;
    return;
  }
  const e = EV()[i], picked = A[i];
  app.innerHTML = `
  <div class="wrap play">
    <div class="row"><div class="eyebrow">${esc(G().name)} · ${i+1} из ${n}</div>${dots(i)}</div>
    <div class="card" style="display:grid;gap:16px">
      <h2>${esc(e.title)}</h2>
      ${e.story?`<p class="tiny">${esc(e.story)}</p>`:""}
      ${e.options.length===2?`<div class="faces">
        ${e.options.map((o,k)=>`<button class="face ${picked===k?'picked':''}" data-k="${k}" ${picked!=null?'disabled':''}><span class="ph">${FACES[o]?`<img src="${esc(FACES[o])}" alt="" onerror="this.remove()">`:""}${esc(o[0])}</span><b>${esc(o)}</b><span class="arrow">${k===0?'← влево':'вправо →'}</span></button>`).join("")}
      </div>`:`<div class="opts">
        ${e.options.map((o,k)=>`<button class="opt ${picked===k?'picked':''}" data-k="${k}" ${picked!=null?'disabled':''}><span>${esc(o)}</span>${picked===k?'<span class="tick">выбрано</span>':''}</button>`).join("")}
      </div>`}
      ${picked!=null?`<p class="tiny">Ответ записан.</p>`:(e.options.length===2?`<p class="tiny">Смахните карточку или нажмите на фото. 1 раз.</p>`:`<p class="tiny">Выбрать можно 1 раз.</p>`)}
    </div>
    <div class="row">
      <span></span>
      <button class="btn" id="next" ${picked==null?'disabled':''}>${i===n-1?'Мой счёт':'Дальше'}</button>
    </div>
  </div>`;
  app.querySelectorAll(".opt,.face").forEach(b => b.onclick = () => { if(b.disabled) return; A[i]=+b.dataset.k; save(); render() });
  app.querySelector("#next").onclick = () => { S.i=i+1; save(); render() };
  if (e.options.length===2 && picked==null) {
    const card = app.querySelector(".card"); card.classList.add("swipe"); card.style.transition="transform .12s ease";
    let x0=null, moved=false;
    const pick = k => { A[i]=k; save(); render() };
    card.onpointerdown = ev => { x0=ev.clientX; moved=false; try{card.setPointerCapture(ev.pointerId)}catch(_){} };
    card.onpointermove = ev => { if(x0==null) return; const dx=ev.clientX-x0; if(Math.abs(dx)>6) moved=true; if(moved) card.style.transform=`translateX(${dx*0.35}px) rotate(${dx*0.02}deg)` };
    const end = ev => {
      if(x0==null) return; const dx=ev.clientX-x0; x0=null; card.style.transform="";
      if (moved) { if(dx<-60) pick(0); else if(dx>60) pick(1); return; }
      const f = document.elementFromPoint(ev.clientX, ev.clientY)?.closest(".face"); if (f) pick(+f.dataset.k);
    };
    card.onpointerup = end; card.onpointercancel = () => { x0=null; card.style.transform="" };
    card.querySelectorAll(".face").forEach(b => { b.onclick = ev => ev.preventDefault() });
  }
}

function boot(){ load(); render() }
window.addEventListener("hashchange", boot);
boot();
</script>

</body>
</html>
