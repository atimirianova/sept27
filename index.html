<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Настя и Витя</title>
<style>body{margin:0;background:#F5EDE1;color:#6F4E37;font-family:system-ui,sans-serif}p{padding:28px 20px;font-size:17px}a{color:inherit}@media(prefers-color-scheme:dark){body{background:#1d1714;color:#F2DFA6}}</style>
</head>
<body>
<p id="m">Загружаю…</p>
<script>
fetch("app.html?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(h){document.open();document.write(h);document.close()}).catch(function(){document.getElementById("m").innerHTML='Не загрузилось. <a href="app.html?t='+Date.now()+location.hash+'">Открыть напрямую</a>'});
</script>
</body>
</html>
